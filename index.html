<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAF CBAT Practice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Landing / Test Selection Screen -->
        <div id="screen-menu" class="screen active">
            <header class="menu-header">
                <div class="raf-badge">&#9733;</div>
                <h1>RAF CBAT Practice</h1>
                <p class="subtitle">Computer-Based Aptitude Test Trainer</p>
            </header>
            <div class="menu-controls">
                <button id="btn-start-all" class="btn btn-primary btn-lg">Start Full Battery</button>
                <button id="btn-view-scores" class="btn btn-secondary">View Previous Scores</button>
            </div>
            <div class="test-grid" id="test-grid">
                <!-- Populated by JS -->
            </div>
            <footer class="menu-footer">
                <p>Practice tool only &mdash; not affiliated with the RAF or MoD.<br>
                Scoring uses estimated stanine boundaries based on public information.</p>
            </footer>
        </div>

        <!-- Test Instructions Screen -->
        <div id="screen-instructions" class="screen">
            <div class="instructions-panel">
                <h2 id="instr-title"></h2>
                <div id="instr-body"></div>
                <div class="instructions-controls">
                    <button id="btn-start-test" class="btn btn-primary">Begin Test</button>
                    <button id="btn-back-menu" class="btn btn-secondary">Back to Menu</button>
                </div>
            </div>
        </div>

        <!-- Active Test Screen -->
        <div id="screen-test" class="screen">
            <div class="test-hud">
                <span id="hud-test-name" class="hud-item"></span>
                <span id="hud-timer" class="hud-item hud-timer">--:--</span>
                <span id="hud-question" class="hud-item"></span>
                <span id="hud-score" class="hud-item"></span>
            </div>
            <div id="test-area" class="test-area">
                <!-- Each test renders here -->
            </div>
        </div>

        <!-- Results Screen -->
        <div id="screen-results" class="screen">
            <div class="results-panel">
                <h2>Test Complete</h2>
                <div id="results-body"></div>
                <div class="results-controls">
                    <button id="btn-results-menu" class="btn btn-primary">Back to Menu</button>
                    <button id="btn-results-retry" class="btn btn-secondary">Retry Test</button>
                </div>
            </div>
        </div>

        <!-- Full Battery Results Screen -->
        <div id="screen-battery-results" class="screen">
            <div class="results-panel results-panel-wide">
                <h2>Full Battery Results</h2>
                <div id="battery-results-body"></div>
                <div class="results-controls">
                    <button id="btn-battery-menu" class="btn btn-primary">Back to Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
